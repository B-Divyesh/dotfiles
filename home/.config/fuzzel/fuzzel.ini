# fuzzel 1.15 — launcher + every picker (clipboard, emoji, power, wallpaper, shortcuts)
[main]
font=Inter:size=12,JetBrainsMono Nerd Font:size=12
terminal=alacritty -e {cmd}
layer=overlay
prompt="  "
placeholder=Search apps…
icon-theme=Papirus-Dark
icons-enabled=yes
match-mode=fzf
fields=filename,name,generic,keywords
lines=9
width=38
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=26
anchor=center
exit-on-keyboard-focus-loss=yes

[colors]
background=1a141bf2
text=d8c8b8ff
prompt=e89b5eff
placeholder=7d6a66ff
input=f0e4d4ff
match=e89b5eff
selection=33262cff
selection-text=f0e4d4ff
selection-match=efcf9fff
counter=7d6a66ff
border=e89b5ecc

[border]
width=2
radius=14
selection-radius=9

[dmenu]
exit-immediately-if-empty=yes
