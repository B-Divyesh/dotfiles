# hyprlock 0.9 — lock screen (Super + L, or automatically via hypridle)
# Colours: Ember palette (see conf/theme.lua)

$font      = Inter
$fontBold  = Inter Bold
$text      = rgb(f0e4d4)
$subtext   = rgba(bfa998ee)
$amber     = rgb(e89b5e)
$ember     = rgb(c8643c)

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = out, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 3, out
    animation = fadeOut, 1, 3, out
    animation = inputFieldDots, 1, 2, out
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper
    color = rgb(1a141b)
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    vibrancy = 0.2
}

# clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $fontBold
    position = 0, 190
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 95
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    rounding = -1
    outer_color = $amber $ember 45deg
    inner_color = rgba(1a141bcc)
    font_color = $text
    font_family = $font
    check_color = rgb(efcf9f) $amber 120deg
    fail_color = rgb(e5534b) rgb(e07a7a) 45deg
    capslock_color = rgb(efcf9f)
    fade_on_empty = false
    placeholder_text = <span foreground="##bfa998">  $USER</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -20
    halign = center
    valign = center
}

# battery
label {
    monitor =
    text = cmd[update:30000] echo "󰁹  $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $subtext
    font_size = 13
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
