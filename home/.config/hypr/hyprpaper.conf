# hyprpaper 0.8 — wallpaper daemon.
# ~/.config/hypr/wallpaper is a symlink; Super + Ctrl + W (scripts/wallpaper)
# re-points it and swaps the wallpaper live. Drop images into ~/Pictures/Wallpapers.
splash = false
ipc = true

wallpaper {
    monitor = *
    path = ~/.config/hypr/wallpaper
    fit_mode = cover
}
