<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Default monospace font with proper fallbacks -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Hack Nerd Font Mono</family>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Material Icons</family>
      <family>Font Awesome 7 Free</family>
      <family>github-octicons</family>
      <family>Weather Icons</family>
      <family>FontAwesome</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Ensure all Nerd Font variants have proper fallbacks -->
  <alias>
    <family>Hack Nerd Font</family>
    <prefer>
      <family>Hack Nerd Font</family>
      <family>Symbols Nerd Font</family>
      <family>Material Icons</family>
      <family>Font Awesome 7 Free</family>
    </prefer>
  </alias>

  <alias>
    <family>Hack Nerd Font Mono</family>
    <prefer>
      <family>Hack Nerd Font Mono</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Material Icons</family>
      <family>Font Awesome 7 Free</family>
    </prefer>
  </alias>

  <!-- Make sure symbol fonts are available for fallback -->
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Material Icons</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Font Awesome 7 Free</string>
    </edit>
  </match>
</fontconfig>
